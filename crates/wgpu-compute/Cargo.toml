[package]
name = "wgpu-compute"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "wgpu (Vulkan) Compute backend for the Muse Glimmer architecture module: device selection per BACKEND.md, the full kernel set K1 through K8 (Q4_K, Q6_K and Q5_K dequant GEMVs, RMSNorm, RoPE plus KV append, GQA attention, SwiGLU, embedding gather and head finish) behind the muse-glimmer Compute trait"

[lints]
workspace = true

[dependencies]
attention = { path = "../attention" }
gguf = { path = "../gguf" }
muse-glimmer = { path = "../muse-glimmer" }
pollster = "0.4"
wgpu = "27"

[dev-dependencies]
cpu-compute = { path = "../cpu-compute" }
pollster = "0.4"
torch-math = { path = "../torch-math" }
wgpu = "27"
