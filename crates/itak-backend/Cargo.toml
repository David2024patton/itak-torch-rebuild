[package]
name = "itak-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Hardware backends for the iTaK Torch engine: hardware detection (AMD VRAM from amdgpu sysfs, NVIDIA via nvidia-smi, CPU-only fallback) and auto-config backend selection"

[lints]
workspace = true

[dependencies]
# No dependencies on purpose: detection reads sysfs files and runs
# nvidia-smi through std only, so this crate stays auditable at a
# glance and builds identically anywhere the engine builds.
