[package]
name = "itak-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The itak-engine binary of the iTaK Torch Rust engine: wires the gguf, itak-loader, tokenizer, muse-glimmer, and cpu-compute crates into one executable that loads a GGUF model, tokenizes a prompt, and runs greedy generation"

[[bin]]
name = "itak-engine"
path = "src/main.rs"

[dependencies]
cpu-compute = { path = "../cpu-compute" }
gguf = { path = "../gguf" }
itak-loader = { path = "../itak-loader" }
muse-glimmer = { path = "../muse-glimmer" }
tokenizer = { path = "../tokenizer" }

[lints]
workspace = true
