# Mojo/MAX engine toolchain manifest.
# Reproducible setup: `pixi install` in this directory, then
# `pixi run test` / `pixi run engine`. Versions pinned to the exact
# toolchain proved on the RX 7900 XTX by the kernel test lane
# (bench/mojo-kernel-test-2026-11-07.md): Mojo 1.2.0, MAX 26.7.
[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "mojo-engine"
platforms = ["linux-64"]
version = "1.1.0"

[tasks]
engine = "mojo run -I src src/main.mojo"
test = "./tests/run_tests.sh"
k1-fixture = "mojo run -I src src/kernels/k1_gemv.mojo"

[dependencies]
mojo = ">=1.2.0,<2"
max = ">=26.7.0,<27"
