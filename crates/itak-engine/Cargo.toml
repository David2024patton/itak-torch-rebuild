[package]
name = "itak-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The iTaK Torch engine binary (ARCHITECTURE.md module grid): owns one loaded model on a worker thread and serves the platform's NDJSON-over-unix-socket protocol (hello, ping, debug, generate) with streamed token events and named errors"

[dependencies]
cpu-compute = { path = "../cpu-compute" }
gguf = { path = "../gguf" }
itak-loader = { path = "../itak-loader" }
muse-glimmer = { path = "../muse-glimmer" }
tokenizer = { path = "../tokenizer" }

[lints]
workspace = true

[[bin]]
name = "itak-engine"
path = "src/main.rs"
