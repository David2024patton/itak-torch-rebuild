[package]
name = "itak-loader"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The loader bridge of the iTaK Torch Rust engine (ARCHITECTURE.md module grid): implements the muse-glimmer architecture module's Metadata and TensorSource traits over the gguf crate, and verifies a file's tensor inventory against the arch module's expected tensor names, failing by name on any miss"

[dependencies]
arch-llama = { path = "../arch-llama" }
gguf = { path = "../gguf" }
muse-glimmer = { path = "../muse-glimmer" }

[dev-dependencies]
cpu-compute = { path = "../cpu-compute" }
tokenizer = { path = "../tokenizer" }

[lints]
workspace = true
